<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="#1a1a2e"/>
  
  <!-- Gradient for claws -->
  <defs>
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Claw marks -->
  <g fill="url(#clawGradient)">
    <!-- Center claw -->
    <path d="M256 120 L256 320 Q256 340 246 340 Q236 340 236 320 L236 200 Q236 160 256 120" 
          transform="rotate(0 256 256)"/>
    
    <!-- Left claw -->
    <path d="M176 140 L196 300 Q198 320 188 322 Q178 324 176 304 L166 200 Q164 170 176 140" 
          transform="rotate(-15 256 256)"/>
    
    <!-- Right claw -->
    <path d="M336 140 L316 300 Q314 320 324 322 Q334 324 336 304 L346 200 Q348 170 336 140" 
          transform="rotate(15 256 256)"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="72" font-weight="bold" fill="#ffffff">MyClaw</text>
</svg>